    "/api/v1/subscription": {
      "get": {
        "summary": "Read own subscription and capacity",
        "operationId": "GET_api_v1_subscription",
        "tags": [
          "subscription"
        ],
        "x-roles": [
          "admin",
          "manager",
          "warehouseStaff",
          "deliveryPartner"
        ],
        "description": "Subscription is required before tenant operations. Owners choose an active global plan; staff cannot subscribe/cancel/resume. All plans are currently free. First-subscription trial is granted once per business; switching plans preserves remaining trial and never restarts it. Accepted limits/terms are snapshotted. Recurring free periods use the original Indian calendar billing day, clamped in short months, and are derived from the persisted anchor without a scheduler or fake payments. Cancel stops renewal at trial/current-period end; resume before expiry. Expired tenants must select a plan again. Usage is returned only to admin/manager. SKU usage counts active variants plus active products without active variants; a first variant uses the reserved product slot. Active variants still count if their parent is archived. Creating products/extra variants/warehouses/partners is serialized with plan changes and bounded by the plan; over-limit additions return PLAN_LIMIT_REACHED. Selecting a plan below current usage returns PLAN_BELOW_USAGE. Existing records are retained. Future nonzero-price subscriptions require a verified payment integration; no card/UPI charge is performed.",
