        ],
        "description": "CustomerPickup orders only. Atomic once-only handover from the order's fixed active pickupLocationId, never vehicle stock. Requires current location assignment unless admin/manager, or empty location assignments. Riders may collect only their own created pickup orders; warehouse staff may collect assigned-location pickup orders. Nonempty items must be on the order and no greater than ordered quantities; full or partial collection is final. Partial collection requires reason and releases uncollected reservations. Cancellation of an open order releases reservation without moving stock. FIFO business-wide reservation priority remains enforced; physical quantity must also exist at this specific location, otherwise the entire operation rolls back. Invoice uses current variant prices and the saved discount (fixed discount prorated for partial collection), applies existing advance and allocates actual receipts oldest invoice first; surplus is advance. Staff may record cash/UPI/bank received during this specific handover, without global ledger access. All stock changes use move() with kind customerPickup and invoice reference; stock, invoice numbering, payment, allocations and closed order commit in one WithTx. Empty trip IDs on invoice/payment; no trip or vehicle is created. Duplicate/concurrent attempts return ORDER_ALREADY_CLOSED. Overpayment stays credit. Collected status is collected or partiallyCollected.",
