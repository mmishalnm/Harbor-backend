        "description": "Close once. Empty delivered array means failure. Partial/failed delivery requires reason. Variant prices are read at delivery. Existing advance is allocated first, then payments oldest invoice first. Late orders with delivered quantities must be fully picked first (ORDER_NOT_FULLY_PICKED otherwise); empty failed deliveries remain possible. Leftovers stay on van until returned. Partners own trips only. Optional couponId OR manual discount, never both. Admin/manager manual discounts require a reason; staff/riders can apply only active pre-approved coupons. Terms are snapshotted on order creation. Fixed discounts cannot exceed the current order subtotal. Delivery retains current variant prices: percentage applies to delivered subtotal; fixed discount is prorated by delivered subtotal / full-order subtotal at those same delivery-time prices, capped to prevent a negative invoice. Undelivered goods receive no discount or invoice. Proportional line allocation uses largest remainders so cents sum exactly. Payments, ledger, advance and sales analytics use net totals.",
