      "post": {
        "summary": "Create order",
        "operationId": "POST_api_v1_orders",
        "tags": [
          "orders"
        ],
        "x-roles": [
          "admin",
          "manager",
          "warehouseStaff",
          "deliveryPartner"
        ],
        "description": "Riders can create orders for customers in their own business. With autoAssignDeliveryPartnerOrders enabled, atomically add a pending stop to their current-window trip, or create a planned trip for today with the assigned vehicle. Started trips are preferred; remaining ties use earliest start/creation/ID. Missing vehicle or a full current trip fails the whole request without creating an orphan order. With the setting disabled, orders remain open. Creating an order never moves physical stock. Unpicked open/assigned quantities reserve storage stock oldest order first. With 225 on hand and an order of 13, reserved is 13 and available is 212. Orders exceeding storage stock remain allowed, with awaitingStockItems until stock arrives. Optional tripId chooses a specific own trip instead of automatic assignment. Existing orders participate immediately; no migration is needed. Optional couponId OR manual discount, never both. Admin/manager manual discounts require a reason; staff/riders can apply only active pre-approved coupons. Terms are snapshotted on order creation. Fixed discounts cannot exceed the current order subtotal. Delivery retains current variant prices: percentage applies to delivered subtotal; fixed discount is prorated by delivered subtotal / full-order subtotal at those same delivery-time prices, capped to prevent a negative invoice. Undelivered goods receive no discount or invoice. Proportional line allocation uses largest remainders so cents sum exactly. Payments, ledger, advance and sales analytics use net totals. fulfillmentType defaults to delivery. For customerPickup, pickupLocationId is required; tripId is forbidden and rider auto-trip assignment is skipped. The order reserves stock without physical deduction or invoice. Complete it with POST /orders/{id}/collect when the customer actually receives goods. One collection location per order; transfer stock there before handover if necessary. Existing van-loading pickup workflow stays delivery fulfillment.",
