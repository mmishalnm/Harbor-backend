                        "total": 2
                      },
                      "trend": {
                        "items": [
                          {
                            "date": "2026-11-20",
                            "salesAmount": 2485,
                            "unitsSold": 23,
                            "invoiceCount": 1
                          }
                        ],
                        "page": 1,
                        "limit": 31,
                        "total": 1
                      },
                      "generatedAt": "2026-11-20T09:00:00Z"
                    }
                  },
                  "productFilter": {
                    "value": {
                      "period": {
                        "dateFrom": "2026-11-20",
                        "dateTo": "2026-11-20",
                        "timeZone": "Asia/Kolkata"
                      },
                      "filters": {
