{
  "openapi": "3.0.3",
  "info": {
    "title": "Harbor by Code Wayne",
    "version": "1.13.0",
    "description": "Business account isolation is enforced from the signed JWT accountId on every protected operation. Do not send a tenant selector. Staff see all storage locations when their location assignment is empty, otherwise assigned locations; trips remain assignment-scoped; riders see their own trips. Warehouse, inventory and delivery backend. Quantities are whole units. Currency is INR; amounts round to two decimals. All stock and money changes are transactional. See README.md for the acceptance walkthrough, including the required 2.5kg stock receipt."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/api/v1/analytics/sales": {
      "get": {
        "summary": "Sales analytics by period, product, variant and customer",
        "operationId": "GET_api_v1_analytics_sales",
        "tags": [
          "analytics"
        ],
        "x-roles": [
          "admin",
          "manager"
        ],
        "description": "Admin/manager only, signed business scope. Read-only, single transaction snapshot. Sales use issued invoice creation dates and saved line amounts, never current variant prices, order quantities or pickup stock. Cancelled invoices are excluded; archived products, variants and customers remain in historical results. Product/variant filters count only matching invoice lines; invoiceCount/customerCount are distinct within the matching set, and averageInvoiceValue is matching sales divided by matching invoices. Collections are receipts dated within the period/customer, independent of invoice dates or payment allocation; they are omitted (null) when filtering a product/variant because receipts cannot be attributed to product lines. Filters apply before every total and pagination. Both date boundaries are inclusive Indian calendar dates. With no dates, defaults to this month through today in IST; dateTo alone uses the first day of that month, dateFrom alone uses today. Maximum 366 days. Variant must belong to selected product; foreign/missing references return NOT_FOUND. Products are ranked by sales descending then variantId, and trends are chronological with zero-sales periods included. Product rows and trend rows paginate independently; page/limit apply to products, trendPage/trendLimit to trend. Daily buckets use YYYY-MM-DD; monthly buckets use the first day of the month and partial boundary months contain only the selected dates. No stock or money is changed. Sales and average prices are net of invoice discounts; collection amounts remain actual receipts.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-account-isolation": true,
        "parameters": [
          {
            "in": "query",
            "name": "page",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 20
            }
          },
          {
            "in": "query",
            "name": "dateFrom",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-11-20"
          },
          {
            "in": "query",
            "name": "dateTo",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-11-20"
          },
          {
            "in": "query",
            "name": "productId",
            "schema": {
              "type": "string",
              "pattern": "^MPN-[0-9]+$"
            }
          },
          {
            "in": "query",
            "name": "variantId",
            "schema": {
              "type": "string",
              "pattern": "^MVN-[0-9]+$"
            }
          },
          {
            "in": "query",
            "name": "customerId",
            "schema": {
              "type": "string",
              "pattern": "^CUS-[0-9]+$"
            }
          },
          {
            "in": "query",
            "name": "groupBy",
            "schema": {
              "type": "string",
              "enum": [
                "day",
                "month"
              ],
              "default": "day"
            }
          },
          {
            "in": "query",
            "name": "trendPage",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
          {
            "in": "query",
            "name": "trendLimit",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 31
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Expected response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SalesAnalytics"
                },
                "examples": {
                  "allProducts": {
                    "value": {
                      "period": {
                        "dateFrom": "2026-11-20",
                        "dateTo": "2026-11-20",
                        "timeZone": "Asia/Kolkata"
                      },
                      "filters": {},
                      "groupBy": "day",
                      "summary": {
                        "salesAmount": 2485,
                        "unitsSold": 23,
                        "invoiceCount": 1,
                        "customerCount": 1,
                        "averageInvoiceValue": 2485
                      },
                      "collections": {
                        "total": 3500,
                        "cash": 3500,
                        "upi": 0,
                        "bank": 0
                      },
                      "collectionsScope": "Customer receipts dated in this period; may settle older invoices or become advance credit. Not sales revenue.",
                      "products": {
                        "items": [
                          {
                            "productId": "MPN-000001",
                            "productName": "ICE",
                            "variantId": "MVN-000001",
                            "variantName": "5kg",
                            "unitsSold": 18,
                            "salesAmount": 2160,
                            "invoiceCount": 1,
                            "averageUnitPrice": 120
                          },
                          {
                            "productId": "MPN-000001",
                            "productName": "ICE",
                            "variantId": "MVN-000002",
                            "variantName": "2.5kg",
                            "unitsSold": 5,
                            "salesAmount": 325,
